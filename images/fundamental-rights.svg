<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="The Fundamental Rights and their Articles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171D38"/><stop offset="1" stop-color="#0E1220"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E4FF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
  </defs>
  <rect width="800" height="520" rx="28" fill="url(#bg)"/>
  <text x="400" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#E8ECFA">Fundamental Rights</text>
  <text x="400" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#8791B5">Part III of the Constitution, Articles 12 to 35</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(40,128)"><rect width="226" height="168" rx="20" fill="#1B2240" stroke="#22E4FF" stroke-opacity=".5"/><circle cx="113" cy="44" r="22" fill="url(#a)"/><text x="113" y="51" font-size="22" font-weight="800" fill="#0E1220">1</text><text x="113" y="100" font-size="19" font-weight="800" fill="#E8ECFA">Equality</text><text x="113" y="130" font-size="16" fill="#8791B5">Articles 14 to 18</text></g>
    <g transform="translate(287,128)"><rect width="226" height="168" rx="20" fill="#1B2240" stroke="#22E4FF" stroke-opacity=".5"/><circle cx="113" cy="44" r="22" fill="url(#a)"/><text x="113" y="51" font-size="22" font-weight="800" fill="#0E1220">2</text><text x="113" y="100" font-size="19" font-weight="800" fill="#E8ECFA">Freedom</text><text x="113" y="130" font-size="16" fill="#8791B5">Articles 19 to 22</text></g>
    <g transform="translate(534,128)"><rect width="226" height="168" rx="20" fill="#1B2240" stroke="#22E4FF" stroke-opacity=".5"/><circle cx="113" cy="44" r="22" fill="url(#a)"/><text x="113" y="51" font-size="22" font-weight="800" fill="#0E1220">3</text><text x="113" y="94" font-size="19" font-weight="800" fill="#E8ECFA">Against</text><text x="113" y="116" font-size="19" font-weight="800" fill="#E8ECFA">Exploitation</text><text x="113" y="144" font-size="16" fill="#8791B5">Articles 23 and 24</text></g>
    <g transform="translate(40,320)"><rect width="226" height="168" rx="20" fill="#1B2240" stroke="#22E4FF" stroke-opacity=".5"/><circle cx="113" cy="44" r="22" fill="url(#a)"/><text x="113" y="51" font-size="22" font-weight="800" fill="#0E1220">4</text><text x="113" y="94" font-size="19" font-weight="800" fill="#E8ECFA">Freedom of</text><text x="113" y="116" font-size="19" font-weight="800" fill="#E8ECFA">Religion</text><text x="113" y="144" font-size="16" fill="#8791B5">Articles 25 to 28</text></g>
    <g transform="translate(287,320)"><rect width="226" height="168" rx="20" fill="#1B2240" stroke="#22E4FF" stroke-opacity=".5"/><circle cx="113" cy="44" r="22" fill="url(#a)"/><text x="113" y="51" font-size="22" font-weight="800" fill="#0E1220">5</text><text x="113" y="94" font-size="19" font-weight="800" fill="#E8ECFA">Cultural and</text><text x="113" y="116" font-size="19" font-weight="800" fill="#E8ECFA">Educational</text><text x="113" y="144" font-size="16" fill="#8791B5">Articles 29 and 30</text></g>
    <g transform="translate(534,320)"><rect width="226" height="168" rx="20" fill="#1B2240" stroke="#22E4FF" stroke-opacity=".5"/><circle cx="113" cy="44" r="22" fill="url(#a)"/><text x="113" y="51" font-size="22" font-weight="800" fill="#0E1220">6</text><text x="113" y="94" font-size="19" font-weight="800" fill="#E8ECFA">Constitutional</text><text x="113" y="116" font-size="19" font-weight="800" fill="#E8ECFA">Remedies</text><text x="113" y="144" font-size="16" fill="#8791B5">Article 32</text></g>
  </g>
