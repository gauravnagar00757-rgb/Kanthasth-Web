<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1220">
  <title>Project Kanthasth – Skill Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ MAIN MENU ============ -->
  <div id="main-menu-screen">
    <div class="menu__bg" aria-hidden="true"><div class="menu__grid"></div></div>

    <div class="menu__inner">
      <header class="menu__hero">
        <h1 class="menu__title">KANTHASTH</h1>
        <p class="menu__sub">The Strict SSC CGL AI Mentor</p>
      </header>

      <nav class="menu__actions" aria-label="Main menu">
        <button class="btn btn--off" id="btn-resume" type="button" disabled>
          <span class="btn__label">Resume Journey</span>
          <span class="btn__meta" id="resume-meta">No save found</span>
        </button>
        <button class="btn btn--primary" id="btn-new" type="button">
          <span class="btn__label">Start New Journey</span>
        </button>
      </nav>

      <section class="menu__subjects" aria-labelledby="subjects-title">
        <h2 class="menu__h2" id="subjects-title">Choose your subject</h2>
        <div class="subjects" id="subjects"></div>
      </section>
    </div>

    <div class="confirm hidden" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <div class="confirm__card">
        <h2 class="confirm__title" id="confirm-title">Erase your progress?</h2>
        <p class="confirm__text" id="confirm-text"></p>
        <div class="confirm__actions">
          <button class="btn btn--ghost" id="confirm-cancel" type="button">Keep my save</button>
          <button class="btn btn--danger" id="confirm-ok" type="button">Erase and start over</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ GAMEPLAY ============ -->
  <div id="gameplay-screen" class="hidden" tabindex="-1">

  <header class="top">
    <h1 class="top__title">Polity</h1>
    <button class="top__menu" id="btn-menu" type="button">Menu</button>
    <p class="top__sub" id="progress-text">0 of 0 modules cleared</p>
    <div class="top__bar" role="progressbar" aria-label="Polity progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
      <span class="top__fill" id="progress-fill"></span>
    </div>
  </header>

  <main class="tree-wrap">
    <div class="tree" id="tree">
      <svg class="tree__links" id="links" aria-hidden="true" focusable="false"></svg>
      <!-- Nodes are rendered by app.js -->
    </div>
  </main>

  <div class="arena" id="arena" role="dialog" aria-modal="true" aria-labelledby="arena-title" hidden>
    <div class="arena__card" id="arena-card">
      <div class="arena__head">
        <h2 class="arena__title" id="arena-title"></h2>
        <button class="arena__voice" id="arena-voice" type="button" aria-pressed="true">&#128266; Voice on</button>
        <button class="arena__close" id="arena-close" type="button" aria-label="Leave arena">&#10005;</button>
      </div>
      <p class="arena__count" id="arena-count"></p>
      <p class="arena__q" id="arena-question"></p>
      <div class="arena__options" id="arena-options"></div>
      <section class="explain" id="arena-explain" hidden aria-live="polite">
        <p class="explain__verdict" id="explain-verdict"></p>
        <p class="explain__text" id="explain-text"></p>
        <button class="btn btn--primary arena__continue" id="arena-continue" type="button">Continue</button>
      </section>
    </div>
  </div>

  <aside class="mentor is-open" id="mentor" aria-label="AI mentor">
    <div class="mentor__hud">
      <div class="stat" id="stat-hearts" aria-label="Hearts"></div>
      <div class="stat" id="stat-streak" aria-label="Streak"></div>
      <div class="stat" id="stat-xp" aria-label="Experience points"></div>
      <button class="mentor__toggle" id="mentor-toggle" type="button" aria-expanded="true" aria-controls="mentor-body" aria-label="Collapse mentor">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="mentor__body" id="mentor-body">
      <div class="mentor__inner">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="52" height="52">
            <defs>
              <linearGradient id="av-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#22E4FF"/>
                <stop offset="1" stop-color="#7C5CFF"/>
              </linearGradient>
            </defs>
            <path d="M32 3l25 14.5v29L32 61 7 46.500v-29z" fill="url(#av-g)"/>
            <path d="M32 8l20.500 12v24L32 56 11.500 44V20z" fill="#0E1220"/>
            <rect x="19" y="26" width="26" height="9" rx="4.500" fill="#22E4FF"/>
            <rect x="24" y="29" width="5" height="3" rx="1.500" fill="#0E1220"/>
            <rect x="35" y="29" width="5" height="3" rx="1.500" fill="#0E1220"/>
            <path d="M24 44h16" stroke="#7C5CFF" stroke-width="2.500" stroke-linecap="round"/>
          </svg>
        </div>
        <button class="bubble" id="bubble" type="button" aria-live="polite" title="Tap for the next instruction"></button>
      </div>
    </div>
  </aside>

  </div><!-- /gameplay-screen -->

  <script src="app.js"></script>
</body>
</html>
